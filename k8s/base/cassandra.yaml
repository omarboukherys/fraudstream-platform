apiVersion: v1
kind: Service
metadata: {name: cassandra, namespace: fraudstream}
spec:
  clusterIP: None
  selector: {app: cassandra}
  ports: [{name: cql, port: 9042}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: cassandra, namespace: fraudstream}
spec:
  serviceName: cassandra
  replicas: 1
  selector: {matchLabels: {app: cassandra}}
  template:
    metadata: {labels: {app: cassandra}}
    spec:
      containers:
        - name: cassandra
          image: cassandra:5.0
          ports: [{containerPort: 9042}]
          env:
            - {name: CASSANDRA_CLUSTER_NAME, value: fraudstream}
            - {name: MAX_HEAP_SIZE, value: 1G}
            - {name: HEAP_NEWSIZE, value: 128M}
          resources: {requests: {cpu: 500m, memory: 1536Mi}, limits: {memory: 2Gi}}
          readinessProbe:
            exec: {command: ["/bin/sh", "-c", "cqlsh -e 'describe keyspaces' >/dev/null"]}
            initialDelaySeconds: 60
            periodSeconds: 15
          volumeMounts: [{name: data, mountPath: /var/lib/cassandra}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
---
apiVersion: batch/v1
kind: Job
metadata: {name: cassandra-init, namespace: fraudstream}
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: cqlsh
          image: cassandra:5.0
          command: ["cqlsh", "cassandra", "-f", "/schema/schema.cql"]
          volumeMounts: [{name: schema, mountPath: /schema}]
      volumes:
        - name: schema
          configMap: {name: cassandra-schema-file}
