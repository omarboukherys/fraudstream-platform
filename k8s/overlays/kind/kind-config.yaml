kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fraudstream
nodes:
  - role: control-plane
    extraPortMappings:
      - {containerPort: 30800, hostPort: 8000}   # agents API
      - {containerPort: 30404, hostPort: 4040}   # Spark UI
      - {containerPort: 30809, hostPort: 8090}   # producer API
