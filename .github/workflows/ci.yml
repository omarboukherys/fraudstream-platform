name: CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - run: pip install -e "agents[test]" && pip install -r batch-airflow/requirements.txt pytest
      - run: cd agents && python -m pytest -q
      - run: cd batch-airflow && python -m pytest -q tests
  scala:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17", cache: sbt}
      - uses: sbt/setup-sbt@v1
      - run: cd streaming-spark && sbt -batch test
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21", cache: maven}
      - run: cd producer-springboot && mvn -q -B test
  images:
    runs-on: ubuntu-latest
    needs: [python, scala, java]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fraudstream/agents:ci agents
      - run: docker build -t fraudstream/producer:ci producer-springboot
