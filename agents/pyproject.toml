[project]
name = "fraudstream-agents"
version = "0.1.0"
description = "Agents IA (Gemini + LangGraph) pour l'investigation des alertes de fraude et le suivi du pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langchain-core>=0.3",
    "langgraph>=1.0,<2",
    "langchain-google-genai>=2.0",
    "kafka-python>=2.1",
    "cassandra-driver>=3.29",
    "duckdb>=1.1",
    "google-cloud-bigquery>=3.25",
    "sqlglot>=25",
]

[project.optional-dependencies]
vertex = ["langchain-google-vertexai>=2.0"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fraudstream_agents*"]
