
# FraudStream Platform – stack locale complète (zéro coût)
# Lancer : docker compose up -d --build
# UIs    : Kafka UI :18085 | Airflow :18081 | Agents API :18800/docs | Spark UI :14040 | Producteur :18090  (ports modifiables dans .env)

name: fraudstream

x-common-env: &common-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  CASSANDRA_HOST: cassandra
  CASSANDRA_KEYSPACE: fraudstream
  LAKE_PATH: /data/lake            # Parquet local ; sur GCP -> gs://<bucket>/lake

services:
  # ---------------------------------------------------------------- Kafka (KRaft, sans ZooKeeper)
  kafka:
    image: apache/kafka:3.9.0
    container_name: fs-kafka
    ports:
      - "9094:9094"                 # accès depuis la machine hôte
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: fraudstream-local-cluster-0001
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: fs-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      K=/opt/kafka/bin/kafka-topics.sh
      $$K --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions.raw --partitions 3 --replication-factor 1
      $$K --bootstrap-server kafka:9092 --create --if-not-exists --topic fraud.alerts     --partitions 3 --replication-factor 1
      $$K --bootstrap-server kafka:9092 --create --if-not-exists --topic agent.reports    --partitions 1 --replication-factor 1
      $$K --bootstrap-server kafka:9092 --list
      "

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fs-kafka-ui
    ports:
      - "${KAFKA_UI_PORT:-18085}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------- Cassandra (serving temps réel)
  cassandra:
    image: cassandra:5.0
    container_name: fs-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: fraudstream
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 1G
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20

  cassandra-init:
    image: cassandra:5.0
    container_name: fs-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra/schema.cql:/schema.cql:ro
    command: ["cqlsh", "cassandra", "-f", "/schema.cql"]

  # ---------------------------------------------------------------- Producteur Spring Boot
  producer:
    build: ./producer-springboot
    container_name: fs-producer
    ports:
      - "${PRODUCER_PORT:-18090}:8090"
    environment:
      <<: *common-env
      PRODUCER_RATE_PER_SECOND: ${PRODUCER_RATE_PER_SECOND:-20}
      PRODUCER_FRAUD_RATIO: ${PRODUCER_FRAUD_RATIO:-0.005}
      PRODUCER_CUSTOMERS: ${PRODUCER_CUSTOMERS:-500}
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------- Spark Structured Streaming (Scala)
  spark-streaming:
    build: ./streaming-spark
    container_name: fs-spark-streaming
    ports:
      - "${SPARK_UI_PORT:-14040}:4040"
    environment:
      <<: *common-env
      CHECKPOINT_PATH: /data/checkpoints
      SPARK_DRIVER_MEMORY: 1g
    volumes:
      - lake-data:/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------- Airflow (batch quotidien PySpark -> BigQuery)
  airflow-db:
    image: postgres:16-alpine
    container_name: fs-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 10

  airflow:
    build: ./batch-airflow
    container_name: fs-airflow
    ports:
      - "${AIRFLOW_PORT:-18081}:8080"
    environment:
      <<: *common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      USE_BIGQUERY: ${USE_BIGQUERY:-false}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      BQ_DATASET: ${BQ_DATASET:-fraudstream}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa.json
    volumes:
      - ./batch-airflow/dags:/opt/airflow/dags
      - ./batch-airflow/jobs:/opt/airflow/jobs
      - lake-data:/data
      - ${GCP_SA_KEY_PATH:-./gcp/.empty}:/secrets/gcp-sa.json:ro
    command: standalone
    depends_on:
      airflow-db:
        condition: service_healthy

  # ---------------------------------------------------------------- Agents IA (Gemini + LangGraph)
  agents:
    build: ./agents
    container_name: fs-agents
    ports:
      - "${AGENTS_PORT:-18800}:8000"
    environment:
      <<: *common-env
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      USE_BIGQUERY: ${USE_BIGQUERY:-false}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      BQ_DATASET: ${BQ_DATASET:-fraudstream}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa.json
      ALERT_CONSUMER_ENABLED: "true"
    volumes:
      - lake-data:/data
      - ${GCP_SA_KEY_PATH:-./gcp/.empty}:/secrets/gcp-sa.json:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully

volumes:
  cassandra-data:
  lake-data:
  airflow-db:
